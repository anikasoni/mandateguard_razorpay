name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify editable package discovery
        run: python -c "from pathlib import Path; import mandateguard; assert 'backend/src/mandateguard' in Path(mandateguard.__file__).resolve().as_posix()"
      - name: Lint
        run: python -m ruff check backend
      - name: Check formatting
        run: python -m ruff format --check backend
      - name: Type-check
        run: python -m mypy backend/src
      - name: Test
        run: python -m pytest backend/tests --cov=mandateguard --cov-report=term-missing
      - name: Verify Alembic
        run: |
          python -m alembic -c backend/alembic.ini heads
          python -m alembic -c backend/alembic.ini upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint
        run: npm run lint --prefix frontend
      - name: Type-check
        run: npm run typecheck --prefix frontend
      - name: Test
        run: npm run test --prefix frontend -- --run
      - name: Build
        run: npm run build --prefix frontend
