[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mandateguard"
version = "0.1.0"
description = "Deterministic financial mandate enforcement for AI purchasing agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1,<2",
    "fastapi>=0.141.1,<0.142",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.0.52,<2.1",
    "uvicorn[standard]>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.12,<3",
    "mypy>=1.18,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.coverage.run]
branch = true
source = ["mandateguard"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mandateguard"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
